name: Daily Data Update

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */2 * * *'  # 這裡修改為每兩小時執行一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        # 移除了不需要的 yfinance 和 twstock 以節省時間
        run: pip install pandas requests lxml

      - name: Run fetch script
        run: python fetch.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/
          # 檢查是否有變更，有變更才 commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ETF data" && git push)
